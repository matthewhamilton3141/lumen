<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<main class="app">
  <section class="stage" id="stage">
    <div class="view" id="view">
      <canvas id="out"></canvas>
      <video id="vid" loop playsinline preload="auto" hidden></video>
      <label class="drop" id="drop">
        <input type="file" id="file" accept="video/*,image/*,.mov,.mp4,.webm,.mkv" hidden>
        <span class="drop-box">
          <span class="drop-main">Drop a video or image here</span>
          <span class="drop-sub">or click to choose a file</span>
        </span>
      </label>
    </div>
    <div class="transport" id="transport" hidden>
      <button class="icon" id="play" aria-label="Play" title="Play / pause (Space)" data-video>
        <svg viewBox="0 0 16 16" id="play-icon"><path d="M4 2.5v11l9-5.5z"/></svg>
      </button>
      <div class="timeline" data-video>
        <div class="tl-marks" id="tl-marks" aria-hidden="true"></div>
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      </div>
      <span class="time" id="time" data-video>0:00 / 0:00</span>
      <button class="icon" id="mute" aria-label="Mute" title="Sound (M)" aria-pressed="false">
        <svg viewBox="0 0 16 16" id="mute-icon"></svg>
      </button>
      <span class="spacer"></span>
      <button class="text" id="orig" aria-pressed="false" title="Show the source (S)">Source</button>
      <button class="text" id="swap-file">Change file</button>
    </div>
    <div class="looks" id="looks" role="group" aria-label="Looks"></div>
  </section>

  <aside class="panel">
    <div class="panel-top">
      <span class="meta" id="meta">Demo</span>
      <button class="text" id="theme" aria-label="Toggle theme">Dark</button>
    </div>

    <section class="group">
      <label class="row">Shape
        <select id="look"></select>
      </label>
      <label class="row">Dither
        <select id="algorithm"></select>
      </label>
      <label class="row slider"><span id="width-label">Detail</span> <output data-for="width"></output>
        <input type="range" id="width" min="32" max="1280" step="2">
      </label>
      <label class="row slider">Contrast <output data-for="contrast"></output>
        <input type="range" id="contrast" min="-100" max="100" step="1">
      </label>
      <label class="row slider">Glow <output data-for="glow"></output>
        <input type="range" id="glow" min="0" max="1" step="0.01">
      </label>
      <label class="row slider">Twinkle <output data-for="twinkle"></output>
        <input type="range" id="twinkle" min="0" max="1" step="0.01">
      </label>
    </section>

    <section class="group">
      <div class="seg three" role="radiogroup" id="mode">
        <button role="radio" data-v="mono">Mono</button>
        <button role="radio" data-v="color">Palette</button>
        <button role="radio" data-v="original">Original</button>
      </div>
      <div class="colors" data-mode="mono">
        <label class="swatch">Ink <input type="color" id="ink"></label>
        <label class="swatch">Paper <input type="color" id="paper"></label>
        <button class="text" id="swap-colors">Swap</button>
        <button class="text" id="reset-colors">Reset</button>
      </div>
      <label class="row" data-mode="color">Palette
        <select id="preset"></select>
      </label>
    </section>

    <section class="group" id="clips-group" hidden>
      <div class="trim">
        <label>In <input type="text" id="t0" inputmode="decimal" spellcheck="false" autocomplete="off" value="0:00.000" title="m:ss.mmm or seconds. ↑/↓ one frame, Shift 1 s."></label>
        <button class="text" id="set-t0" title="Set In to the playhead (I)">Set</button>
        <label>Out <input type="text" id="t1" inputmode="decimal" spellcheck="false" autocomplete="off" value="0:00.000" title="m:ss.mmm or seconds. ↑/↓ one frame, Shift 1 s."></label>
        <button class="text" id="set-t1" title="Set Out to the playhead (O)">Set</button>
      </div>
      <button class="secondary" id="add-clip" title="Add In → Out to the clips (A)">Add clip</button>
      <ol class="clips" id="clips" aria-label="Clips"></ol>
      <p class="note" id="clips-note"></p>
      <button class="secondary" id="copy-cmd" title="Copy an npm run cut command with these clips and settings">Copy as command</button>
    </section>

    <section class="group">
      <div class="seg five" role="radiogroup" id="format">
        <button role="radio" data-v="mp4">MP4</button>
        <button role="radio" data-v="mov">MOV</button>
        <button role="radio" data-v="gif">GIF</button>
        <button role="radio" data-v="png">PNG</button>
        <button role="radio" data-v="html">HTML</button>
      </div>
      <div class="seg two" role="radiogroup" id="embed" data-fmt="html">
        <button role="radio" data-v="page">Page</button>
        <button role="radio" data-v="snippet">Embed snippet</button>
      </div>
      <button class="primary" id="export" disabled>Export</button>
      <div class="progress" id="progress" hidden>
        <div class="bar"><div id="bar"></div></div>
        <span id="pct">0%</span>
        <button class="text" id="cancel">Cancel</button>
      </div>
      <p class="note" id="status" role="status"></p>
      <button class="secondary" id="copy" hidden>Copy snippet</button>
    </section>

    <details class="group" data-g="more">
      <summary>More</summary>

      <label class="row slider"><span id="scale-label">Export scale</span> <output data-for="scale"></output>
        <input type="range" id="scale" min="1" max="16" step="1">
      </label>
      <label class="row slider" id="dot-gain-row">Dot gain <output data-for="dotGain"></output>
        <input type="range" id="dotGain" min="0" max="0.5" step="0.01">
      </label>
      <label class="row slider" id="glow-size-row">Glow size <output data-for="glowSize"></output>
        <input type="range" id="glowSize" min="0.5" max="6" step="0.5">
      </label>
      <div class="colors" id="bg-row">
        <label class="swatch">Background <input type="color" id="bg"></label>
        <button class="text" id="bg-auto" aria-pressed="true">Auto</button>
      </div>

      <div data-mode="original">
        <label class="row slider">Levels per channel <output data-for="chLevels"></output>
          <input type="range" id="chLevels" min="2" max="6" step="1">
        </label>
      </div>
      <div data-mode="color">
        <div class="swatches" id="swatches"></div>
        <div class="palette-actions">
          <button class="text" id="add-color">Add</button>
          <button class="text" id="remove-color">Remove</button>
          <button class="text" id="sort-colors">Sort</button>
        </div>
        <label class="row slider">Colours from source <output data-for="count"></output>
          <input type="range" id="count" min="2" max="16" step="1">
        </label>
        <button class="secondary" id="from-video" disabled>Pick colours from source</button>
      </div>

      <label class="row slider" data-mode="mono" id="levels-row">Levels <output data-for="levels"></output>
        <input type="range" id="levels" min="2" max="8" step="1">
      </label>
      <label class="row slider" data-show="amount">Amount <output data-for="strength"></output>
        <input type="range" id="strength" min="0" max="1" step="0.01">
      </label>
      <label class="check" data-show="diffusion"><input type="checkbox" id="serpentine"> Serpentine scan</label>

      <label class="row slider">Brightness <output data-for="brightness"></output>
        <input type="range" id="brightness" min="-100" max="100" step="1">
      </label>
      <label class="row slider">Gamma <output data-for="gamma"></output>
        <input type="range" id="gamma" min="0.2" max="3" step="0.01">
      </label>
      <label class="row slider" data-mode="color original">Saturation <output data-for="saturation"></output>
        <input type="range" id="saturation" min="-100" max="100" step="1">
      </label>
      <label class="row slider">Threshold <output data-for="threshold"></output>
        <input type="range" id="threshold" min="0" max="255" step="1">
      </label>
      <label class="check"><input type="checkbox" id="invert"> Invert</label>

      <label class="row">Frame
        <select id="aspect"></select>
      </label>
      <div id="fit-row">
        <div class="seg two" role="radiogroup" id="fit">
          <button role="radio" data-v="crop">Crop to fill</button>
          <button role="radio" data-v="contain">Fit with bars</button>
        </div>
      </div>
      <p class="note" id="size-note"></p>

      <div id="time-group">
        <label class="row slider">Frame rate <output data-for="fps"></output>
          <input type="range" id="fps" min="1" max="60" step="1">
        </label>
      </div>

      <div class="seg two" role="radiogroup" id="embedFit" data-fmt="html">
        <button role="radio" data-v="contain">Fit: contain</button>
        <button role="radio" data-v="cover">Fit: cover</button>
      </div>
      <label class="check" data-fmt="mp4 mov"><input type="checkbox" id="audio"> Keep audio</label>
      <label class="check" data-fmt="html gif" data-video><input type="checkbox" id="loop"> Loop</label>
      <p class="note" id="fmt-note"></p>
    </details>
  </aside>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>

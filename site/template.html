<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen, living art for HTML</title>
<meta name="description" content="Living art for HTML: turn photos and videos into dithered, glowing pieces for your site. One snippet, no plugins.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #ece8e1;      /* text on the dark stage */
    --dim: #9a958c;      /* secondary text */
    --faint: #5c5852;    /* inactive index entries */
    --black: #000;       /* the pieces' own background, so edges vanish */
    --rule: rgba(236, 232, 225, 0.18);
    --serif: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --gutter: clamp(20px, 3.2vw, 44px);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--black); color: var(--ink); }
  body {
    font-family: var(--serif); font-optical-sizing: auto; font-size: 17px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  a { color: inherit; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  /* The stage: one piece at a time, filling the screen. Hidden pieces are display:none,
     so their players pause (they only run while on screen). */
  .stage { position: fixed; inset: 0; }
  .piece { position: absolute; inset: 0; }
  .piece[hidden] { display: none; }
  .piece.in { animation: in 600ms ease-out; }
  @keyframes in { from { opacity: 0; } }
  /* Let the bottom text sit on darkness without a visible box. */
  .stage::after {
    content: ""; position: absolute; inset: auto 0 0 0; height: 58%; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,0) 100%);
  }

  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2;
    display: flex; justify-content: space-between; align-items: baseline;
    padding: calc(var(--gutter) * .7) var(--gutter);
  }
  .mark { font-size: 19px; font-style: italic; text-decoration: none; letter-spacing: .005em; }
  .open { font-size: 15px; text-underline-offset: 4px; text-decoration-color: var(--rule); }
  .open:hover { text-decoration-color: var(--ink); }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 0 var(--gutter) var(--gutter);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--gutter); align-items: end;
    pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }

  h1 {
    --scale: 1;
    grid-column: 1 / -1; margin: 0 0 clamp(22px, 4vh, 44px); max-width: 18ch;
    font-weight: 330; font-size: calc(clamp(38px, 5.1vw, 80px) * var(--scale)); line-height: 1; letter-spacing: -.016em;
    text-wrap: balance;
    /* A soft dark halo keeps the words readable over bright dots without a box. */
    text-shadow: 0 0 28px rgba(0, 0, 0, .75), 0 0 6px rgba(0, 0, 0, .5);
  }
  /* Placed per piece (desktop): anchored at x/y percent of the viewport. */
  h1.placed { position: fixed; margin: 0; z-index: 2; }
  h1.easing { transition: left 520ms cubic-bezier(.2, .7, .2, 1), top 520ms cubic-bezier(.2, .7, .2, 1), transform 520ms cubic-bezier(.2, .7, .2, 1), font-size 520ms ease; }

  .credit { margin: 0; font-size: 12px; line-height: 1.35; color: var(--faint); max-width: 40ch; }

  /* Index of works, and the two looks. */
  .index { display: grid; gap: 14px; justify-items: end; text-align: right; }
  .works, .looks { display: flex; gap: 4px 18px; flex-wrap: wrap; justify-content: flex-end; margin: 0; padding: 0; list-style: none; }
  .index button {
    font: inherit; color: var(--faint); background: none; border: 0; padding: 2px 0; cursor: pointer;
    font-size: 17px; transition: color 160ms;
  }
  .index button:hover { color: var(--dim); }
  .index button[aria-pressed="true"] { color: var(--ink); }
  .works button { font-style: italic; }
  .looks { border-top: 1px solid var(--rule); padding-top: 12px; }
  .hint { font-size: 13px; color: var(--faint); margin: 0; }

  /* Cursor: a dot and a checker-dithered ring, both locked to the pointer.
     Small and quiet, so it never competes with the art. */
  .cursor { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; opacity: 0; transition: opacity 200ms; }
  html.has-cursor .cursor { opacity: 1; }
  .cursor .dot, .cursor .ring { position: absolute; left: 0; top: 0; border-radius: 50%; }
  .cursor .dot {
    width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px; background: var(--ink);
    box-shadow: 0 0 6px rgba(236, 232, 225, .9), 0 0 14px rgba(236, 232, 225, .45);
  }
  .cursor .ring {
    width: 32px; height: 32px; margin: -16px 0 0 -16px;
    background: repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 2px 2px;
    -webkit-mask: radial-gradient(circle, transparent 13.5px, #000 14px, #000 16px, transparent 16.5px);
    mask: radial-gradient(circle, transparent 13.5px, #000 14px, #000 16px, transparent 16.5px);
    filter: drop-shadow(0 0 3px rgba(236, 232, 225, .55));
  }
  @media (hover: hover) and (pointer: fine) {
    html.has-cursor, html.has-cursor * { cursor: none !important; }
  }
  @media (hover: none), (pointer: coarse) { .cursor { display: none; } }

  /* Temporary text editor (?edit or E). */
  .editor {
    position: fixed; top: calc(var(--gutter) * .7 + 34px); left: 50%; transform: translateX(-50%); z-index: 40;
    display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; justify-content: center;
    padding: 8px 14px; font-size: 13px; color: var(--dim);
    background: rgba(0, 0, 0, .72); border: 1px solid var(--rule); border-radius: 3px;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .editor[hidden] { display: none; }
  .editor b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
  .editor button { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); }
  .editor button:hover { text-decoration-color: var(--ink); }
  .editor .keys { color: var(--faint); }
  body.editing h1 { outline: 1px dashed rgba(236, 232, 225, .35); outline-offset: 8px; cursor: grab; touch-action: none; user-select: none; }
  body.editing h1.dragging { cursor: grabbing; outline-color: var(--ink); }

  @media (max-width: 760px) {
    body { font-size: 16px; }
    .bottom { grid-template-columns: 1fr; row-gap: 18px; }
    h1 { font-size: clamp(34px, 10.5vw, 52px); margin-bottom: 4px; }
    .index { justify-items: start; text-align: left; }
    .works, .looks { justify-content: flex-start; }
    .hint { display: none; }
    .credit { order: 3; }
    .stage::after { height: 72%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .piece.in { animation: none; }
    h1.easing { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
<!--pieces-->
  </div>

  <header class="top">
    <a class="mark" href="./">Lumen</a>
    <a class="open" href="/">Open the app</a>
  </header>

  <section class="bottom" aria-label="Now showing">
    <h1 id="headline">Living art for HTML.</h1>
    <p class="credit">Footage: National Geographic Short Film Showcase.</p>
    <nav class="index" aria-label="Works">
      <ul class="works" id="works"></ul>
      <ul class="looks" id="looks"></ul>
      <p class="hint">Arrow keys to browse. Click the image to pause.</p>
    </nav>
  </section>

  <div class="editor" id="editor" role="toolbar" aria-label="Headline editor" hidden>
    <span>Editing <b id="ed-key"></b></span>
    <span class="keys">Drag the headline. A: align. + / −: size.</span>
    <button type="button" id="ed-reset">Reset this piece</button>
    <button type="button" id="ed-copy">Copy all positions</button>
    <button type="button" id="ed-exit">Exit</button>
  </div>
</main>
<div class="cursor" id="cursor" aria-hidden="true"><div class="ring"></div><div class="dot"></div></div>

<script>
const WORKS = /*works*/[];
const LOOKS = /*looks*/{};
// Headline placement per piece, baked in from the editor's "Copy all positions".
// { "lilies-2/led": { "x": 6, "y": 40, "align": "left", "scale": 1 } }, x/y in % of the viewport.
const POSITIONS = {};
const $ = (id) => document.getElementById(id);
let work = WORKS[0].id, look = Object.keys(LOOKS)[0];
const keyNow = () => `${work}/${look}`;

// URL hash keeps the selection, so a link opens the same piece: #lilies-2/neonascii
const fromHash = () => {
  const [w, l] = location.hash.slice(1).split('/');
  if (WORKS.some((x) => x.id === w)) work = w;
  if (l in LOOKS) look = l;
};

const button = (text, pressed, onclick) => {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.textContent = text; b.setAttribute('aria-pressed', pressed); b.onclick = onclick;
  li.append(b); return li;
};

function show(first) {
  const key = keyNow();
  for (const el of document.querySelectorAll('.piece')) {
    const on = el.dataset.key === key;
    if (on && el.hidden) { el.hidden = false; if (!first) { el.classList.remove('in'); void el.offsetWidth; el.classList.add('in'); } }
    else if (!on) el.hidden = true;
  }
  const w = WORKS.find((x) => x.id === work);
  $('works').replaceChildren(...WORKS.map((x) => button(x.title, x.id === work, () => { work = x.id; go(); })));
  $('looks').replaceChildren(...Object.entries(LOOKS).map(([id, name]) => button(name, id === look, () => { look = id; go(); })));
  document.title = `${w.title} in ${LOOKS[look]}, Lumen`;
  place(!first);
  $('ed-key').textContent = key;
}
function go() { history.replaceState(null, '', `#${work}/${look}`); show(false); }

// ---- Headline placement ----------------------------------------------------------------
// Desktop only: on phones the headline stays in the stacked layout.
const STORE = 'lumen-site:positions';
const h1 = $('headline');
const wide = matchMedia('(min-width: 761px)');
let stored = {};
try { stored = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch {}
const saved = (k) => stored[k] || POSITIONS[k] || null;
const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(stored)); } catch {} };
let base = null; // where the headline sits in the normal layout, as a position

// Measure the default spot once fonts are in, so placing it there doesn't move anything.
function measureBase() {
  const was = h1.className, style = h1.getAttribute('style');
  h1.className = ''; h1.removeAttribute('style');
  const r = h1.getBoundingClientRect();
  base = { x: (r.left / innerWidth) * 100, y: (r.top / innerHeight) * 100, align: 'left', scale: 1 };
  h1.className = was; if (style !== null) h1.setAttribute('style', style);
}
const SHIFT = { left: '0', center: '-50%', right: '-100%' };
function apply(p, ease) {
  h1.classList.toggle('easing', !!ease);
  h1.classList.add('placed');
  h1.style.left = `${p.x}%`;
  h1.style.top = `${p.y}%`;
  h1.style.transform = `translateX(${SHIFT[p.align] || '0'})`;
  h1.style.textAlign = p.align;
  h1.style.setProperty('--scale', p.scale);
}
function place(ease) {
  if (!wide.matches) { h1.className = ''; h1.removeAttribute('style'); return; }
  if (!base) return;
  apply(saved(keyNow()) || base, ease);
}
const current = () => ({ ...(saved(keyNow()) || base) });
wide.addEventListener('change', () => { if (wide.matches) { measureBase(); place(false); } else place(false); });
addEventListener('resize', () => { if (wide.matches && !saved(keyNow())) { h1.className = ''; h1.removeAttribute('style'); measureBase(); place(false); } });

// ---- Temporary editor --------------------------------------------------------------------
let editing = false;
function setEditing(on) {
  editing = on && wide.matches;
  document.body.classList.toggle('editing', editing);
  $('editor').hidden = !editing;
}
function update(p) {
  stored[keyNow()] = { x: +p.x.toFixed(2), y: +p.y.toFixed(2), align: p.align, scale: +p.scale.toFixed(2) };
  persist();
  apply(stored[keyNow()], false);
}
// The anchor point is the left edge, centre or right edge of the box, at its top.
const anchorX = (r, align) => (align === 'center' ? r.left + r.width / 2 : align === 'right' ? r.right : r.left);
let drag = null;
h1.addEventListener('pointerdown', (e) => {
  if (!editing || e.button !== 0) return;
  e.preventDefault();
  const r = h1.getBoundingClientRect(), p = current();
  drag = { id: e.pointerId, dx: e.clientX - anchorX(r, p.align), dy: e.clientY - r.top };
  h1.setPointerCapture(e.pointerId);
  h1.classList.add('dragging');
});
h1.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = current();
  p.x = Math.min(100, Math.max(0, ((e.clientX - drag.dx) / innerWidth) * 100));
  p.y = Math.min(98, Math.max(0, ((e.clientY - drag.dy) / innerHeight) * 100));
  update(p);
});
const endDrag = () => { drag = null; h1.classList.remove('dragging'); };
h1.addEventListener('pointerup', endDrag);
h1.addEventListener('pointercancel', endDrag);
const resize = (by) => { const p = current(); p.scale = Math.min(2.5, Math.max(0.4, p.scale + by)); update(p); };
h1.addEventListener('wheel', (e) => { if (!editing) return; e.preventDefault(); resize(e.deltaY < 0 ? 0.04 : -0.04); }, { passive: false });
function cycleAlign() {
  // Keep the box where it is: move the anchor to the new edge.
  const p = current(), r = h1.getBoundingClientRect();
  p.align = { left: 'center', center: 'right', right: 'left' }[p.align] || 'left';
  p.x = (anchorX(r, p.align) / innerWidth) * 100;
  update(p);
}
$('ed-reset').onclick = () => { delete stored[keyNow()]; persist(); place(true); };
$('ed-copy').onclick = async () => {
  const all = { ...POSITIONS, ...stored };
  const btn = $('ed-copy');
  try { await navigator.clipboard.writeText(JSON.stringify(all, null, 2)); btn.textContent = `Copied ${Object.keys(all).length}`; }
  catch { btn.textContent = 'Copy failed'; console.log(JSON.stringify(all, null, 2)); }
  setTimeout(() => { btn.textContent = 'Copy all positions'; }, 1600);
};
$('ed-exit').onclick = () => setEditing(false);

addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
  const i = WORKS.findIndex((x) => x.id === work), keys = Object.keys(LOOKS), j = keys.indexOf(look);
  if (e.key === 'ArrowRight') { work = WORKS[(i + 1) % WORKS.length].id; go(); }
  else if (e.key === 'ArrowLeft') { work = WORKS[(i - 1 + WORKS.length) % WORKS.length].id; go(); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); look = keys[(j + 1) % keys.length]; go(); }
  else if (e.key === 'e' || e.key === 'E') setEditing(!editing);
  else if (editing && (e.key === 'a' || e.key === 'A')) cycleAlign();
  else if (editing && (e.key === '+' || e.key === '=')) resize(0.05);
  else if (editing && (e.key === '-' || e.key === '_')) resize(-0.05);
  else if (editing && e.key === 'Escape') setEditing(false);
});
addEventListener('hashchange', () => { fromHash(); show(false); });

// ---- Cursor ------------------------------------------------------------------------------
// Dot and ring sit exactly on the pointer. Mouse and pen only; touch keeps the system behaviour.
{
  const cur = $('cursor'), root = document.documentElement;
  let px = -100, py = -100, raf = 0;
  const frame = () => { raf = 0; cur.style.translate = `${px}px ${py}px`; };
  addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') { root.classList.remove('has-cursor'); return; }
    root.classList.add('has-cursor');
    px = e.clientX; py = e.clientY;
    if (!raf) raf = requestAnimationFrame(frame);
  });
  document.addEventListener('pointerleave', () => root.classList.remove('has-cursor'));
  addEventListener('blur', () => root.classList.remove('has-cursor'));
}

fromHash();
show(true);

if (new URLSearchParams(location.search).has('edit')) setEditing(true);
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { if (wide.matches) { measureBase(); place(false); } });
</script>
</body>
</html>
